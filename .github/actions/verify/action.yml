name: Rapture Verify
description: Deterministic verification-integrity check — did the change weaken the tests/CI that verify it?
inputs:
  repo:
    description: Path to the git repository (defaults to $GITHUB_WORKSPACE)
    required: false
    default: ""
  base:
    description: Trusted base ref (auto-detected from PR context when omitted)
    required: false
    default: ""
  head:
    description: Candidate/head ref or SHA (defaults to PR head SHA on pull_request)
    required: false
    default: ""
  mode:
    description: verify (single diff) or scan (window)
    required: false
    default: verify
  invariants:
    description: Path to invariants JSON (defaults to <repo>/.rapture/invariants.json)
    required: false
    default: ""
  signing-key:
    description: Path to ed25519 private key PEM for signed receipt
    required: false
    default: ""
  warn-as-error:
    description: Fail the check on WARN (default false — WARN is non-blocking)
    required: false
    default: "false"
outputs:
  verdict:
    description: ACCEPT, WARN, or REJECT
    value: ${{ steps.run.outputs.verdict }}
  base-sha:
    description: Resolved base SHA
    value: ${{ steps.run.outputs.base-sha }}
  head-sha:
    description: Resolved head SHA
    value: ${{ steps.run.outputs.head-sha }}
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.12.1
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - shell: bash
      run: pnpm -r build
    - id: run
      shell: bash
      run: |
        set -euo pipefail
        REPO="${{ inputs.repo }}"
        if [ -z "$REPO" ]; then REPO="$GITHUB_WORKSPACE"; fi
        if [ -z "$REPO" ]; then REPO="."; fi
        BASE="${{ inputs.base }}"
        HEAD_REF="${{ inputs.head }}"
        if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "pull_request_target" ]; then
          if [ -z "$BASE" ] && [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          fi
          if [ -z "$HEAD_REF" ] && [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            HEAD_REF="${{ github.event.pull_request.head.sha }}"
          fi
        fi
        if [ -z "$HEAD_REF" ]; then HEAD_REF="HEAD"; fi
        INV_ARGS=""
        if [ -n "${{ inputs.invariants }}" ]; then INV_ARGS="--invariants ${{ inputs.invariants }}"; fi
        SIGN_ARGS=""
        if [ -n "${{ inputs.signing-key }}" ]; then SIGN_ARGS="--signing-key ${{ inputs.signing-key }}"; fi
        set +e
        if [ "${{ inputs.mode }}" = "scan" ]; then
          if [ -n "$BASE" ]; then
            node apps/cli/dist/index.js scan --repo "$REPO" --base "$BASE" --head "$HEAD_REF" $INV_ARGS $SIGN_ARGS --json > /tmp/rapture-result.json 2>/tmp/rapture-stderr.txt
          else
            node apps/cli/dist/index.js scan --repo "$REPO" --head "$HEAD_REF" $INV_ARGS $SIGN_ARGS --json > /tmp/rapture-result.json 2>/tmp/rapture-stderr.txt
          fi
          SCAN_EXIT=$?
          node apps/cli/dist/index.js scan --repo "$REPO" ${BASE:+--base "$BASE"} --head "$HEAD_REF" $INV_ARGS 2>/tmp/rapture-human.txt || true
          cat /tmp/rapture-human.txt | tee /tmp/rapture-audit.md
        else
          if [ -n "$BASE" ]; then
            node apps/cli/dist/index.js verify --repo "$REPO" --base "$BASE" --candidate "$HEAD_REF" $INV_ARGS $SIGN_ARGS --json > /tmp/rapture-result.json 2>/tmp/rapture-stderr.txt
          else
            node apps/cli/dist/index.js verify --repo "$REPO" --candidate "$HEAD_REF" $INV_ARGS $SIGN_ARGS --json > /tmp/rapture-result.json 2>/tmp/rapture-stderr.txt
          fi
          VERIFY_EXIT=$?
          node apps/cli/dist/index.js verify --repo "$REPO" ${BASE:+--base "$BASE"} --candidate "$HEAD_REF" $INV_ARGS 2>/tmp/rapture-human.txt || true
          cat /tmp/rapture-human.txt | tee /tmp/rapture-verify.txt
          cat /tmp/rapture-verify.txt > /tmp/rapture-audit.md 2>/dev/null || true
        fi
        set -e
        if [ -f /tmp/rapture-result.json ]; then
          VERDICT=$(node -e "const r=require('/tmp/rapture-result.json'); process.stdout.write(r.verdict||'UNKNOWN')" 2>/dev/null || echo UNKNOWN)
          BASE_SHA=$(node -e "const r=require('/tmp/rapture-result.json'); process.stdout.write(r.baseSha||r.baseRef||'')" 2>/dev/null || echo "")
          HEAD_SHA=$(node -e "const r=require('/tmp/rapture-result.json'); process.stdout.write(r.candidateSha||r.headSha||r.candidateRef||'')" 2>/dev/null || echo "")
          SIGNAL_COUNT=$(node -e "const r=require('/tmp/rapture-result.json'); const s=r.signals||[]; process.stdout.write(String(s.length))" 2>/dev/null || echo 0)
        else
          VERDICT=$(grep -oE 'VERDICT: (ACCEPT|WARN|REJECT)|OVERALL VERDICT: (ACCEPT|WARN|REJECT)' /tmp/rapture-audit.md /tmp/rapture-verify.txt 2>/dev/null | grep -oE 'ACCEPT|WARN|REJECT' | tail -1 || echo UNKNOWN)
          BASE_SHA="$BASE"
          HEAD_SHA="$HEAD_REF"
          SIGNAL_COUNT=0
        fi
        {
          echo "## Rapture — Verification Integrity"
          echo ""
          echo "**Verdict:** \`$VERDICT\` · **Base:** \`$BASE_SHA\` · **Head:** \`$HEAD_SHA\` · **Signals:** $SIGNAL_COUNT"
          echo ""
          if [ -f /tmp/rapture-result.json ]; then
            echo "<details><summary>Findings (JSON)</summary>"
            echo ""
            echo '```json'
            cat /tmp/rapture-result.json | head -200
            echo '```'
            echo "</details>"
            echo ""
          fi
          echo "<details><summary>Human-readable report</summary>"
          echo ""
          echo '```'
          cat /tmp/rapture-audit.md 2>/dev/null | head -300 || cat /tmp/rapture-human.txt 2>/dev/null | head -300
          echo '```'
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
        echo "base-sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
        echo "head-sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
        if [ "$VERDICT" = "REJECT" ]; then exit 2; fi
        if [ "$VERDICT" = "WARN" ] && [ "${{ inputs.warn-as-error }}" = "true" ]; then exit 2; fi
        if [ "$VERDICT" = "UNKNOWN" ]; then exit 3; fi
        exit 0
branding:
  icon: shield
  color: blue
